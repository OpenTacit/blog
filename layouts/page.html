{{ define "stage" }}
 <h1 class="site-title">{{ .Title }}</h1>
 <div class="site-pitch">
  {{ with .Description }}<p class="site-lede">{{ . }}</p>{{ end }}
  <p class="post-meta"><time datetime="{{ .Date.Format "2006-01-02" }}">{{ .Date.Format "2 January 2006" }}</time>
   {{- with .Params.author }} · {{ . }}{{ end }}{{ if .Draft }} · draft{{ end }}</p>
 </div>
{{ end }}

{{ define "main" }}
<article class="post">
{{ .Content }}
</article>
{{ end }}

{{ define "close" }}<a href="/">All posts</a>.{{ end }}
